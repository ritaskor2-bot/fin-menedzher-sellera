<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Фин менеджер селлера</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1b1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:60px 22px}
  h1{font-size:30px;margin:0 0 8px;letter-spacing:-.5px}
  .sub{color:var(--muted);margin-bottom:28px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;text-decoration:none;color:inherit;transition:.15s}
  a.card:hover{border-color:#c7d2fe;transform:translateY(-2px)}
  .card .t{font-weight:700;font-size:17px;margin-bottom:6px}
  .card .d{color:var(--muted);font-size:14px}
  .foot{margin-top:28px;color:var(--muted);font-size:12px}
  @media (max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Фин менеджер селлера</h1>
  <div class="sub">Агентская система финансового управления для селлеров Wildberries и Ozon</div>
  <div class="grid">
    <a class="card" href="agent.html">
      <div class="t">Описание проекта</div>
      <div class="d">Проблема, пользователь, функции, MVP, технологии</div>
    </a>
    <a class="card" href="report.html">
      <div class="t">Пример отчёта</div>
      <div class="d">Дашборд селлера: план/факт, поступления, остатки, рекомендации</div>
    </a>
  </div>
  <div class="foot">Демонстрационные материалы: клиентских данных нет.</div>
</div>
</body>
</html>
